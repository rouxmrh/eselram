<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Bookings | Eselram</title>

  <link
    rel="stylesheet"
    href="/app/assets/css/eselram.css"
  >

  <style>
    .es-booking-form-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .es-customer-search-wrap {
      position: relative;
    }

    .es-customer-results {
      position: absolute;
      z-index: 20;
      top: calc(100% - 14px);
      left: 0;
      right: 0;
      overflow: hidden;
      border: 1px solid var(--es-border);
      border-radius: var(--es-radius-md);
      background: var(--es-surface);
      box-shadow: var(--es-shadow);
    }

    .es-customer-result {
      display: grid;
      gap: 2px;
      width: 100%;
      padding: 12px 14px;
      border: 0;
      border-bottom: 1px solid var(--es-border);
      background: transparent;
      color: var(--es-text);
      text-align: left;
      cursor: pointer;
    }

    .es-customer-result:last-child {
      border-bottom: 0;
    }

    .es-customer-result:hover {
      background: #f7f8f5;
    }

    .es-customer-result span {
      color: var(--es-muted);
      font-size: 12px;
    }

    .es-selected-customer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: -8px;
      margin-bottom: 20px;
      padding: 10px 12px;
      border: 1px solid var(--es-border);
      border-radius: var(--es-radius-sm);
      background: #f7f8f5;
      font-size: 13px;
    }

    .es-booking-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
    }

    .es-booking-action {
      min-height: 34px;
      padding: 0 11px;
      border: 1px solid var(--es-border);
      border-radius: var(--es-radius-sm);
      background: var(--es-surface);
      color: var(--es-text);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .es-booking-action:hover {
      border-color: var(--es-primary);
    }

    .es-booking-action.danger {
      color: var(--es-error);
    }

    .es-booking-row {
      grid-template-columns:
        minmax(130px, .8fr)
        minmax(210px, 1.5fr)
        minmax(90px, .55fr)
        auto
        minmax(220px, 1.2fr);
    }

    .es-booking-dialog {
      width: min(560px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      overflow: auto;
      padding: 0;
      border: 1px solid var(--es-border);
      border-radius: var(--es-radius-lg);
      background: var(--es-surface);
      color: var(--es-text);
      box-shadow: var(--es-shadow);
    }

    .es-booking-dialog::backdrop {
      background: rgba(20, 25, 22, .35);
    }

    .es-booking-dialog-inner {
      padding: 28px;
    }

    .es-booking-dialog-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .es-booking-dialog-header h2 {
      margin: 4px 0 0;
    }

    .es-dialog-close {
      border: 0;
      background: transparent;
      color: var(--es-muted);
      font-size: 24px;
      cursor: pointer;
    }

    .es-booking-detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .es-booking-detail {
      display: grid;
      gap: 4px;
    }

    .es-booking-detail span {
      color: var(--es-muted);
      font-size: 12px;
    }

    .es-booking-detail-full {
      grid-column: 1 / -1;
    }

    .es-dialog-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid var(--es-border);
    }

    @media (max-width: 1040px) {
      .es-booking-row {
        grid-template-columns: 1fr 1fr;
      }

      .es-booking-actions {
        justify-content: flex-start;
      }
    }

    @media (max-width: 600px) {
      .es-booking-detail-grid,
      .es-booking-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body class="es-dashboard-body">

  <div class="es-dashboard-layout">

    <aside
  id="appSidebar"
  class="es-sidebar"
></aside>


    <main class="es-dashboard-main">

      <header class="es-dashboard-header">

        <div>

          <p class="es-eyebrow">
            Appointments
          </p>

          <h1>
            Bookings
          </h1>

          <p class="es-lead">
            Create appointments and manage your upcoming schedule.
          </p>

        </div>

        <button
          id="newBookingButton"
          class="es-button"
          type="button"
        >
          New booking
        </button>

      </header>


      <section
        id="bookingFormPanel"
        class="es-dashboard-panel"
        hidden
      >

        <div class="es-booking-form-heading">

          <div>

            <p
              id="bookingFormEyebrow"
              class="es-eyebrow"
            >
              New booking
            </p>

            <h2 id="bookingFormTitle">
              Create appointment
            </h2>

          </div>

        </div>


        <form id="bookingForm">

          <input
            id="bookingId"
            type="hidden"
          >

          <input
            id="selectedCustomerId"
            type="hidden"
          >


          <div class="es-customer-search-wrap">

            <label>
              Find existing customer

              <input
                id="customerSearch"
                type="search"
                placeholder="Search name, email or phone"
                autocomplete="off"
              >
            </label>

            <div
              id="customerSearchResults"
              class="es-customer-results"
              hidden
            ></div>

          </div>


          <div
            id="selectedCustomer"
            class="es-selected-customer"
            hidden
          >

            <span id="selectedCustomerText"></span>

            <button
              id="clearSelectedCustomer"
              class="es-booking-action"
              type="button"
            >
              Use new customer
            </button>

          </div>


          <div class="es-form-grid">

            <label>
              Service

              <select
                id="serviceSelect"
                required
              >
                <option value="">
                  Select a service
                </option>
              </select>

            </label>


            <label>
              Date

              <input
                id="bookingDate"
                type="date"
                required
              >
            </label>

          </div>


          <label>
            Available time

            <select
              id="timeSelect"
              required
              disabled
            >
              <option value="">
                Choose a service and date first
              </option>
            </select>
          </label>


          <div
            id="availabilityStatus"
            class="es-booking-hint"
          >
            Available times will appear after you choose a service and date.
          </div>


          <div class="es-booking-divider"></div>


          <div class="es-form-grid">

            <label>
              First name

              <input
                id="firstName"
                type="text"
                autocomplete="given-name"
                required
              >
            </label>


            <label>
              Last name

              <input
                id="lastName"
                type="text"
                autocomplete="family-name"
                required
              >
            </label>

          </div>


          <div class="es-form-grid">

            <label>
              Email

              <input
                id="email"
                type="email"
                autocomplete="email"
              >
            </label>


            <label>
              Phone

              <input
                id="phone"
                type="tel"
                autocomplete="tel"
              >
            </label>

          </div>


          <label>
            Customer notes

            <textarea
              id="notes"
              placeholder="Optional notes for this appointment"
            ></textarea>
          </label>


          <div
            id="bookingStatus"
            class="es-status"
            role="status"
            aria-live="polite"
            hidden
          ></div>


          <div class="es-form-actions">

            <button
              id="saveBookingButton"
              class="es-button"
              type="submit"
            >
              Create booking
            </button>

            <button
              id="cancelBookingButton"
              class="es-secondary-button"
              type="button"
            >
              Close
            </button>

          </div>

        </form>

      </section>


      <section class="es-dashboard-panel">

        <div class="es-bookings-toolbar">

          <div>

            <p class="es-eyebrow">
              Schedule
            </p>

            <h2>
              Bookings
            </h2>

          </div>


          <div class="es-bookings-filter-group">

            <input
              id="bookingSearch"
              type="search"
              placeholder="Search customer or service"
              aria-label="Search bookings"
            >

            <select
              id="bookingStatusFilter"
              aria-label="Filter by status"
            >
              <option value="all">
                All statuses
              </option>

              <option value="confirmed">
                Confirmed
              </option>

              <option value="completed">
                Completed
              </option>

              <option value="cancelled">
                Cancelled
              </option>
            </select>

          </div>

        </div>


        <div
          id="bookingsList"
          class="es-empty-state"
        >
          Loading bookings…
        </div>

      </section>

    </main>

  </div>


  <dialog
    id="bookingDetailsDialog"
    class="es-booking-dialog"
  >

    <div class="es-booking-dialog-inner">

      <div class="es-booking-dialog-header">

        <div>
          <p class="es-eyebrow">
            Booking details
          </p>

          <h2 id="detailCustomerName">
            Appointment
          </h2>
        </div>

        <button
          id="closeBookingDialog"
          class="es-dialog-close"
          type="button"
          aria-label="Close"
        >
          ×
        </button>

      </div>


      <div
        id="bookingDetailContent"
        class="es-booking-detail-grid"
      ></div>


      <div
        id="bookingDetailActions"
        class="es-dialog-actions"
      ></div>

    </div>

  </dialog>

  <dialog
    id="sendFormDialog"
    class="es-form-request-dialog"
  >
    <div class="es-form-request-dialog-inner">

      <div class="es-booking-dialog-header">
        <div>
          <p class="es-eyebrow">Client form</p>
          <h2 id="sendFormTitle">Send form</h2>
        </div>

        <button
          id="closeSendFormDialog"
          class="es-dialog-close"
          type="button"
          aria-label="Close"
        >
          ×
        </button>
      </div>

      <p id="sendFormContext" class="es-muted-copy"></p>

      <label>
        Published form
        <select id="sendFormTemplate">
          <option value="">Choose a form</option>
        </select>
      </label>

      <div
        id="sendFormStatus"
        class="es-status"
        hidden
      ></div>

      <button
        id="generateFormLinkButton"
        class="es-button"
        type="button"
      >
        Generate secure link
      </button>

      <div
        id="generatedFormLinkWrap"
        class="es-form-request-link"
        hidden
      >
        <input
          id="generatedFormLink"
          type="text"
          readonly
          aria-label="Generated client form link"
        >

        <button
          id="copyGeneratedFormLink"
          class="es-secondary-button"
          type="button"
        >
          Copy link
        </button>

        <button
          id="emailGeneratedFormLink"
          class="es-button"
          type="button"
        >
          Send by email
        </button>
      </div>

      <div class="es-settings-divider"></div>

      <p class="es-eyebrow">Form history</p>

      <div
        id="bookingFormRequests"
        class="es-form-request-list"
      ></div>

    </div>
  </dialog>


  <script type="module">
  import { renderSidebar } from "/components/sidebar.js";
  renderSidebar("bookings");
</script>
  
  <script src="/bookings/bookings.js"></script>

</body>
</html>
