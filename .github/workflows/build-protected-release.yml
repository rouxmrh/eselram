name: Build protected Eselram release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.0.0 or 1.0.0-rc6)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-protected-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install release builder dependencies
        run: npm ci

      - name: Validate requested version
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release version: $VERSION"
            echo "Use a semantic version such as 1.0.0 or 1.0.0-rc6."
            exit 1
          fi
          if [[ "$VERSION" =~ [[:space:]/\\] ]]; then
            echo "Release version contains unsafe characters."
            exit 1
          fi
          echo "Validated release version: $VERSION"

      - name: Verify required production source files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "scripts/build-protected-release.mjs"
            "functions/api/status.js"
            "functions/api/bookings/index.js"
            "functions/api/updates/status.js"
            "settings/index.html"
            "settings/settings.js"
            "workers/eselram-reminders.js"
          )
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Required production file is missing: $file"
              exit 1
            fi
          done
          if ! compgen -G "database/migrations/*.sql" >/dev/null; then
            echo "No database migrations were found."
            exit 1
          fi
          echo "Required production source files are present."

      - name: Build protected release
        run: node scripts/build-protected-release.mjs "${{ inputs.version }}"

      - name: Verify protected release artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          RELEASE="eselram-release-${VERSION}.zip"
          CHECKSUM="${RELEASE}.sha256.txt"

          test -s "$RELEASE"
          test -s "$CHECKSUM"

          EXPECTED="$(tr -d '\r\n[:space:]' < "$CHECKSUM" | tr '[:upper:]' '[:lower:]')"
          ACTUAL="$(sha256sum "$RELEASE" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"

          if [[ ! "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Checksum file does not contain a valid SHA-256 digest."
            exit 1
          fi
          if [[ "$EXPECTED" != "$ACTUAL" ]]; then
            echo "Protected release checksum mismatch."
            exit 1
          fi

          rm -rf .release-verify
          mkdir -p .release-verify
          unzip -q "$RELEASE" -d .release-verify

          test -s .release-verify/eselram-version.json
          test -s .release-verify/payload/_worker.js
          test -s .release-verify/payload/settings/index.html
          test -s .release-verify/payload/settings/settings.js
          test -s .release-verify/payload/workers/eselram-reminders.js

          node -e '
            const fs = require("fs");
            const requested = process.argv[1];
            const manifest = JSON.parse(fs.readFileSync(".release-verify/eselram-version.json", "utf8"));
            if (manifest.version !== requested) {
              console.error(`Release manifest version mismatch. Requested ${requested}, found ${manifest.version}`);
              process.exit(1);
            }
            console.log(`Release manifest version verified: ${manifest.version}`);
          ' "$VERSION"

          if grep -a -q '^------formdata-undici-' .release-verify/payload/_worker.js; then
            echo "Protected _worker.js is multipart form-data, not JavaScript."
            exit 1
          fi

          node --check .release-verify/payload/_worker.js
          node --check .release-verify/payload/settings/settings.js
          node --check .release-verify/payload/workers/eselram-reminders.js

          echo "Protected release verification passed."
          echo "SHA256=$ACTUAL"

      - name: Upload protected release artifact
        uses: actions/upload-artifact@v4
        with:
          name: eselram-release-${{ inputs.version }}
          path: |
            eselram-release-${{ inputs.version }}.zip
            eselram-release-${{ inputs.version }}.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30
