<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Packages</title>
  <link rel="stylesheet" href="/app/assets/css/eselram.css?v=20260821-mobile-nav-v2">
  <style>
    body{background:var(--es-bg,#f6f5f0);color:var(--es-ink,#102333);font-family:system-ui,sans-serif}
    .wrap{max-width:980px;margin:0 auto;padding:40px 20px 70px}
    .head{margin-bottom:26px}.head small{letter-spacing:.16em;text-transform:uppercase}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
    .card,.purchase{background:#fff;border:1px solid #d9d9d2;border-radius:18px;padding:22px}
    .card h2{margin:0 0 6px}.meta{display:flex;gap:10px;flex-wrap:wrap;color:#52605b;font-size:14px}
    .price{font-size:24px;font-weight:800;margin:18px 0 4px}
    button{border:0;border-radius:9px;padding:12px 16px;font-weight:700;cursor:pointer}
    .primary{background:var(--primary,#365178);color:#fff}.secondary{background:#fff;border:1px solid #cfd4cf}
    .purchase{margin-top:22px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    label{display:grid;gap:6px;font-weight:650}input,select{padding:12px;border:1px solid #ccd1cc;border-radius:9px;font:inherit}
    .actions{display:flex;gap:10px;margin-top:18px}.status{margin-top:14px;padding:12px;border-radius:10px;background:#f1f4f1}.error{color:#8b2929}
    @media(max-width:650px){.fields{grid-template-columns:1fr}}
  .back-row{display:flex;margin-bottom:18px}.back-booking{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 15px;border:1px solid #cfd4cf;border-radius:999px;background:#fff;color:#102333;font-size:13px;font-weight:800;text-decoration:none}.back-booking:hover{border-color:var(--primary,#365178);color:var(--primary,#365178)}
</style>
</head>
<body>
  <main class="wrap">
    <div class="back-row">
      <a class="back-booking" href="/book/">← Back to booking</a>
    </div>

    <header class="head">
      <small>Packages & courses</small>
      <h1 id="businessName">Choose a package</h1>
      <p>Purchase a course securely online. Your package will be added to your customer record after payment.</p>
    </header>

    <section id="packageGrid" class="grid"></section>

    <section id="purchasePanel" class="purchase" hidden>
      <h2 id="purchaseTitle">Purchase package</h2>
      <p id="purchaseSummary"></p>
      <form id="purchaseForm">
        <input id="packageId" type="hidden">
        <div class="fields">
          <label>First name<input id="firstName" required autocomplete="given-name"></label>
          <label>Last name<input id="lastName" required autocomplete="family-name"></label>
          <label>Email<input id="email" type="email" required autocomplete="email"></label>
          <label>Phone<input id="phone" autocomplete="tel"></label>
          <label>Payment
            <select id="paymentChoice"></select>
          </label>
        </div>
        <div class="actions">
          <button class="primary" type="submit">Continue to secure payment</button>
          <button id="cancelPurchase" class="secondary" type="button">Cancel</button>
        </div>
        <div id="status" class="status" hidden></div>
      </form>
    </section>
  </main>
  <script src="/buy-package/buy-package.js"></script>
</body>
</html>
