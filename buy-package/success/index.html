<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Package purchase</title>
  <link rel="stylesheet" href="/app/assets/css/eselram.css?v=20260821-mobile-nav-v2">
  <style>
    body{background:var(--es-bg,#f6f5f0);font-family:system-ui,sans-serif;color:#102333}
    main{max-width:680px;margin:70px auto;padding:20px}.card{background:#fff;border:1px solid #d9d9d2;border-radius:20px;padding:30px}
    a{display:inline-block;margin-top:16px;color:#365178;font-weight:700}.status{color:#52605b}
    .booking{margin-top:24px;padding-top:22px;border-top:1px solid #ddd}.booking label{display:grid;gap:6px;margin:12px 0;font-weight:700}
    .booking input,.booking select{padding:11px;border:1px solid #ccd1cc;border-radius:9px;font:inherit;width:100%;box-sizing:border-box}
    .booking button{border:0;border-radius:9px;padding:12px 16px;background:#365178;color:#fff;font-weight:700;cursor:pointer}.back-booking{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 15px;border:1px solid #cfd4cf;border-radius:999px;background:#fff;color:#102333;text-decoration:none;margin:0 0 20px}
  </style>
</head>
<body>
<main><a class="back-booking" href="/book/">← Back to booking</a><section class="card">
  <small>PACKAGE PURCHASE</small>
  <h1 id="title">Checking your payment…</h1>
  <p id="message" class="status">Please keep this page open for a moment.</p>
  <section id="packageBooking" class="booking" hidden>
    <h2>Book your first session</h2>
    <p>Your package is active. Choose an available date and time for the first covered session.</p>
    <label>Date
      <input id="packageBookingDate" type="date">
    </label>
    <label>Available time
      <select id="packageBookingTime">
        <option value="">Choose a date first</option>
      </select>
    </label>
    <button id="bookPackageSession" type="button">Book first session</button>
    <p id="packageBookingStatus" class="status"></p>
  </section>
  <a href="/book/">Book another appointment</a>
</section></main>
<script src="/buy-package/success/success.js"></script>
</body></html>
