<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Calendar | Eselram</title>

  <link
    rel="stylesheet"
    href="/app/assets/css/eselram.css"
  >

  <style>
    .es-calendar-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .es-calendar-heading {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .es-calendar-heading h2 {
      min-width: 190px;
      margin: 0;
      font-size: 24px;
      text-align: center;
    }

    .es-calendar-nav-button,
    .es-calendar-today-button {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--es-border);
      border-radius: var(--es-radius-sm);
      background: var(--es-surface);
      color: var(--es-text);
      font-weight: 700;
      cursor: pointer;
    }

    .es-calendar-nav-button {
      width: 40px;
      padding: 0;
      font-size: 20px;
    }

    .es-calendar-nav-button:hover,
    .es-calendar-today-button:hover {
      border-color: var(--es-primary);
    }

    .es-calendar-weekdays,
    .es-calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .es-calendar-weekdays {
      border: 1px solid var(--es-border);
      border-bottom: 0;
      border-radius:
        var(--es-radius-md)
        var(--es-radius-md)
        0
        0;
      overflow: hidden;
      background: #f7f8f5;
    }

    .es-calendar-weekday {
      padding: 10px 8px;
      border-right: 1px solid var(--es-border);
      color: var(--es-muted);
      font-size: 12px;
      font-weight: 750;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .es-calendar-weekday:last-child {
      border-right: 0;
    }

    .es-calendar-grid {
      border-top: 1px solid var(--es-border);
      border-left: 1px solid var(--es-border);
      background: var(--es-border);
    }

    .es-calendar-day {
      position: relative;
      min-height: 145px;
      padding: 10px;
      border: 0;
      border-right: 1px solid var(--es-border);
      border-bottom: 1px solid var(--es-border);
      background: var(--es-surface);
      color: var(--es-text);
      text-align: left;
      overflow: hidden;
    }

    .es-calendar-day.is-outside {
      background: #fafaf8;
    }

    .es-calendar-day.is-outside .es-calendar-day-number {
      color: #a3aaa5;
    }

    .es-calendar-day.is-today {
      box-shadow:
        inset 0 0 0 2px
        var(--es-primary);
    }

    .es-calendar-day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .es-calendar-day-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      min-height: 28px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 750;
    }

    .es-calendar-day.is-today
    .es-calendar-day-number {
      background: var(--es-primary);
      color: #fff;
    }

    .es-calendar-add {
      border: 0;
      background: transparent;
      color: var(--es-muted);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity .15s ease;
    }

    .es-calendar-day:hover
    .es-calendar-add {
      opacity: 1;
    }

    .es-calendar-events {
      display: grid;
      gap: 5px;
    }

    .es-calendar-event {
      display: grid;
      gap: 1px;
      width: 100%;
      padding: 6px 7px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: #f1f3ef;
      color: var(--es-text);
      text-align: left;
      cursor: pointer;
    }

    .es-calendar-event:hover {
      border-color: var(--es-primary);
    }

    .es-calendar-event strong {
      overflow: hidden;
      font-size: 11px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .es-calendar-event span {
      overflow: hidden;
      color: var(--es-muted);
      font-size: 10px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .es-calendar-event-confirmed {
      border-left: 3px solid var(--es-success);
    }

    .es-calendar-event-completed {
      border-left: 3px solid var(--es-primary);
      opacity: .78;
    }

    .es-calendar-event-cancelled {
      border-left: 3px solid var(--es-error);
      opacity: .58;
      text-decoration: line-through;
    }

    .es-calendar-more {
      padding: 2px 4px;
      color: var(--es-muted);
      font-size: 11px;
      font-weight: 700;
    }

    .es-calendar-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      color: var(--es-muted);
      font-size: 12px;
    }

    .es-calendar-summary strong {
      color: var(--es-text);
    }

    .es-calendar-dialog {
      width: min(560px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      overflow: auto;
      padding: 0;
      border: 1px solid var(--es-border);
      border-radius: var(--es-radius-lg);
      background: var(--es-surface);
      color: var(--es-text);
      box-shadow: var(--es-shadow);
    }

    .es-calendar-dialog::backdrop {
      background: rgba(20, 25, 22, .35);
    }

    .es-calendar-dialog-inner {
      padding: 28px;
    }

    .es-calendar-dialog-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .es-calendar-dialog-header h2 {
      margin: 4px 0 0;
    }

    .es-calendar-dialog-close {
      border: 0;
      background: transparent;
      color: var(--es-muted);
      font-size: 24px;
      cursor: pointer;
    }

    .es-calendar-detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .es-calendar-detail {
      display: grid;
      gap: 4px;
    }

    .es-calendar-detail span {
      color: var(--es-muted);
      font-size: 12px;
    }

    .es-calendar-detail-full {
      grid-column: 1 / -1;
    }

    .es-calendar-dialog-actions {
      display: flex;
      gap: 10px;
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid var(--es-border);
    }

    @media (max-width: 900px) {
      .es-calendar-day {
        min-height: 110px;
        padding: 7px;
      }

      .es-calendar-event span {
        display: none;
      }
    }

    @media (max-width: 700px) {
      .es-calendar-toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .es-calendar-heading {
        justify-content: space-between;
      }

      .es-calendar-heading h2 {
        min-width: 0;
        flex: 1;
      }

      .es-calendar-weekday {
        padding: 8px 2px;
        font-size: 10px;
      }

      .es-calendar-day {
        min-height: 82px;
        padding: 5px;
      }

      .es-calendar-day-number {
        min-width: 24px;
        min-height: 24px;
        font-size: 11px;
      }

      .es-calendar-add {
        display: none;
      }

      .es-calendar-event {
        padding: 4px;
      }

      .es-calendar-event strong {
        font-size: 9px;
      }

      .es-calendar-detail-grid {
        grid-template-columns: 1fr;
      }

      .es-calendar-detail-full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body class="es-dashboard-body">

  <div class="es-dashboard-layout">

    <aside class="es-sidebar">

      <div class="es-sidebar-brand">
        ESELRAM
      </div>

      <nav class="es-sidebar-nav">

        <a href="/dashboard/">
          Overview
        </a>

        <a href="/bookings/">
          Bookings
        </a>

        <a
          href="/calendar/"
          class="active"
        >
          Calendar
        </a>

        <a href="/customers/">
          Customers
        </a>

        <a href="/services/">
          Services
        </a>

        <a href="/settings/#payments">
          Payments
        </a>

        <a href="/settings/">
          Settings
        </a>

      </nav>

    </aside>


    <main class="es-dashboard-main">

      <header class="es-dashboard-header">

        <div>

          <p class="es-eyebrow">
            Schedule
          </p>

          <h1>
            Calendar
          </h1>

          <p class="es-lead">
            View your appointments and plan your schedule.
          </p>

        </div>

        <a
          class="es-button"
          href="/bookings/"
        >
          New booking
        </a>

      </header>


      <section class="es-dashboard-panel">

        <div class="es-calendar-toolbar">

          <div class="es-calendar-heading">

            <button
              id="previousMonthButton"
              class="es-calendar-nav-button"
              type="button"
              aria-label="Previous month"
            >
              ‹
            </button>

            <h2 id="calendarMonthTitle">
              Month
            </h2>

            <button
              id="nextMonthButton"
              class="es-calendar-nav-button"
              type="button"
              aria-label="Next month"
            >
              ›
            </button>

          </div>

          <button
            id="todayButton"
            class="es-calendar-today-button"
            type="button"
          >
            Today
          </button>

        </div>


        <div
          id="calendarStatus"
          class="es-status"
          hidden
        ></div>


        <div class="es-calendar-weekdays">

          <div class="es-calendar-weekday">
            Mon
          </div>

          <div class="es-calendar-weekday">
            Tue
          </div>

          <div class="es-calendar-weekday">
            Wed
          </div>

          <div class="es-calendar-weekday">
            Thu
          </div>

          <div class="es-calendar-weekday">
            Fri
          </div>

          <div class="es-calendar-weekday">
            Sat
          </div>

          <div class="es-calendar-weekday">
            Sun
          </div>

        </div>


        <div
          id="calendarGrid"
          class="es-calendar-grid"
        ></div>


        <div
          id="calendarSummary"
          class="es-calendar-summary"
        ></div>

      </section>

    </main>

  </div>


  <dialog
    id="calendarBookingDialog"
    class="es-calendar-dialog"
  >

    <div class="es-calendar-dialog-inner">

      <div class="es-calendar-dialog-header">

        <div>
          <p class="es-eyebrow">
            Booking
          </p>

          <h2 id="calendarDialogTitle">
            Appointment
          </h2>
        </div>

        <button
          id="closeCalendarDialog"
          class="es-calendar-dialog-close"
          type="button"
          aria-label="Close"
        >
          ×
        </button>

      </div>


      <div
        id="calendarBookingDetails"
        class="es-calendar-detail-grid"
      ></div>


      <div class="es-calendar-dialog-actions">

        <a
          id="openBookingsButton"
          class="es-button"
          href="/bookings/"
        >
          Open bookings
        </a>

      </div>

    </div>

  </dialog>


  <script src="/calendar/calendar.js"></script>

</body>
</html>
