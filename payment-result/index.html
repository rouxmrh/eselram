<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>Payment | Eselram</title>

  <style>
    :root {
      --bg: #f4f3ee;
      --surface: #ffffff;
      --text: #1f2925;
      --muted: #68736d;
      --primary: #365f52;
      --border: #d8ddd9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .card {
      width: min(100%, 620px);
      padding: 42px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--surface);
      box-shadow:
        0 18px 60px
        rgba(31, 41, 37, 0.08);
    }

    .mark {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 28px;
      font-weight: 800;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.08;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .button {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: 750;
      text-decoration: none;
    }

    .powered {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 560px) {
      .card {
        padding: 28px 22px;
        border-radius: 20px;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="card">
    <div
      id="resultMark"
      class="mark"
      aria-hidden="true"
    >
      ✓
    </div>

    <p
      id="resultEyebrow"
      class="eyebrow"
    >
      Payment complete
    </p>

    <h1 id="resultTitle">
      Payment successful
    </h1>

    <p id="resultMessage">
      Thank you. Your payment has been submitted successfully.
    </p>

    <div class="actions">
      <a
        id="returnButton"
        class="button"
        href="#"
        hidden
      >
        Return to business
      </a>
    </div>

    <p class="powered">
      Secure payment powered by Stripe · Booking system powered by Eselram
    </p>
  </main>

  <script src="/payment-result/payment-result.js"></script>
</body>
</html>
