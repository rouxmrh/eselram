<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Payment cancelled</title>
  <link rel="stylesheet" href="/app/assets/css/eselram.css?v=20260821-mobile-nav-v2">
</head>
<body>
  <main class="booking-shell">
    <section class="booking-card">
      <section class="step active" style="display:block;max-width:700px;margin:0 auto;">
        <div class="eyebrow">PAYMENT CANCELLED</div>
        <h2 id="cancelTitle">Your payment wasn't completed</h2>
        <p id="cancelText" class="muted">We're releasing the provisional appointment so you can choose another time when you're ready.</p>
        <div id="cancelError" class="message error" hidden style="margin:20px 0 0"></div>
        <a class="primary-button inline" href="/book/">Return to booking</a>
      </section>
    </section>
  </main>
  <script src="/book/cancelled/cancelled.js" defer></script>
</body>
</html>
