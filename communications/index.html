<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Communications | Eselram</title>
  <link rel="stylesheet" href="/app/assets/css/eselram.css">
</head>
<body class="es-dashboard-body">
  <div class="es-dashboard-layout">
    <aside id="appSidebar" class="es-sidebar"></aside>

    <main class="es-dashboard-main">
      <header class="es-dashboard-header">
        <div>
          <p class="es-eyebrow">Customer communication</p>
          <h1>Communications</h1>
          <p class="es-lead">
            Review automatic booking emails, reminders, client forms and payment confirmations sent by this installation.
          </p>
        </div>
      </header>

      <section class="es-dashboard-panel" style="margin-bottom:18px;">
        <div class="es-panel-header">
          <div>
            <p class="es-eyebrow">Automation</p>
            <h2>Communication automation</h2>
          </div>

          <a
            class="es-secondary-button"
            href="/settings/#notifications"
            style="text-decoration:none;"
          >
            Notification settings
          </a>
        </div>

        <div
          id="communicationsAutomationSummary"
          class="es-services-list"
        ></div>
      </section>

      <section class="es-dashboard-panel">
        <div class="es-panel-header">
          <div>
            <p class="es-eyebrow">Delivery log</p>
            <h2>Email history</h2>
          </div>

          <div class="es-form-actions" style="margin-top:0;">
            <button id="runRemindersButton" class="es-secondary-button" type="button">
              Run reminder check now
            </button>

            <button id="refreshCommunicationsButton" class="es-secondary-button" type="button">
              Refresh
            </button>
          </div>
        </div>

        <div id="communicationsStatus" class="es-status" hidden></div>

        <div
          class="es-form-grid"
          style="margin:16px 0;"
        >
          <label>
            Show
            <select id="communicationsTypeFilter">
              <option value="">All communication types</option>
              <option value="appointment">Bookings & appointments</option>
              <option value="forms">Client forms</option>
              <option value="payments">Payments & packages</option>
            </select>
          </label>

          <label>
            Status
            <select id="communicationsStatusFilter">
              <option value="">All statuses</option>
              <option value="sent">Sent</option>
              <option value="failed">Failed</option>
              <option value="pending">Pending</option>
            </select>
          </label>
        </div>

        <div id="communicationsList" class="es-payments-list"></div>
      </section>
    </main>
  </div>

  <script type="module">
    import { renderSidebar } from "/components/sidebar.js";
    renderSidebar("communications");
  </script>

  <script src="/communications/communications.js"></script>
</body>
</html>
