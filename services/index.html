<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Services | Eselram</title>

  <link
    rel="stylesheet"
    href="/app/assets/css/eselram.css"
  >
</head>

<body class="es-dashboard-body">

  <div class="es-dashboard-layout">

    <aside class="es-sidebar">

      <div class="es-sidebar-brand">
        ESELRAM
      </div>

      <nav class="es-sidebar-nav">

        <a href="/dashboard/">
          Overview
        </a>

        <a href="#">
          Bookings
        </a>

        <a href="#">
          Calendar
        </a>

        <a href="#">
          Customers
        </a>

        <a
          href="/services/"
          class="active"
        >
          Services
        </a>

        <a href="#">
          Payments
        </a>

        <a href="#">
          Settings
        </a>

      </nav>

    </aside>


    <main class="es-dashboard-main">

      <header class="es-dashboard-header">

        <div>
          <p class="es-eyebrow">
            Setup
          </p>

          <h1>Services</h1>

          <p class="es-lead">
            Create and manage the treatments
            or services your business offers.
          </p>
        </div>

        <button
          id="newServiceButton"
          class="es-button"
          type="button"
        >
          Add service
        </button>

      </header>


      <section
        id="serviceFormPanel"
        class="es-dashboard-panel"
        hidden
      >

        <div class="es-panel-header">

          <div>
            <p class="es-eyebrow">
              Service
            </p>

            <h2 id="serviceFormTitle">
              Add service
            </h2>
          </div>

        </div>


        <form id="serviceForm">

          <input
            id="serviceId"
            type="hidden"
          >


          <label>
            Service name

            <input
              id="serviceName"
              type="text"
              required
            >
          </label>


          <label>
            Description

            <textarea
              id="serviceDescription"
              placeholder="Optional"
            ></textarea>
          </label>


          <div class="es-form-grid">

            <label>
              Duration

              <select
                id="serviceDuration"
                required
              >
                <option value="15">15 minutes</option>
                <option value="20">20 minutes</option>
                <option value="30">30 minutes</option>
                <option value="45">45 minutes</option>
                <option value="60" selected>60 minutes</option>
                <option value="75">75 minutes</option>
                <option value="90">90 minutes</option>
                <option value="120">120 minutes</option>
              </select>
            </label>


            <label>
              Price

              <input
                id="servicePrice"
                type="number"
                min="0"
                step="0.01"
                value="0"
                required
              >
            </label>

          </div>


          <label>
            Payment rule

            <select id="paymentTiming">

              <option value="pay_at_appointment">
                Pay at appointment
              </option>

              <option value="online_full">
                Full payment online
              </option>

              <option value="online_deposit">
                Deposit online
              </option>

              <option value="free">
                No payment required
              </option>

            </select>
          </label>


          <label
            id="depositField"
            hidden
          >
            Deposit amount

            <input
              id="serviceDeposit"
              type="number"
              min="0"
              step="0.01"
              value="0"
            >
          </label>


          <fieldset
            id="providerSection"
            class="es-fieldset"
            hidden
          >

            <legend>
              Accepted online payment methods
            </legend>

            <div
              id="providerOptions"
              class="es-provider-options"
            ></div>

          </fieldset>


          <div class="es-check-grid">

            <label class="es-check-option">
              <input
                id="requiresConsultation"
                type="checkbox"
              >

              Requires consultation
            </label>


            <label class="es-check-option">
              <input
                id="requiresPatchTest"
                type="checkbox"
              >

              Requires patch test
            </label>


            <label class="es-check-option">
              <input
                id="serviceActive"
                type="checkbox"
                checked
              >

              Service is active
            </label>

          </div>


          <div
            id="formStatus"
            class="es-status"
            hidden
          ></div>


          <div class="es-form-actions">

            <button
              id="saveServiceButton"
              class="es-button"
              type="submit"
            >
              Save service
            </button>

            <button
              id="cancelServiceButton"
              class="es-secondary-button"
              type="button"
            >
              Cancel
            </button>

          </div>

        </form>

      </section>


      <section class="es-dashboard-panel">

        <div class="es-panel-header">

          <div>
            <p class="es-eyebrow">
              Your services
            </p>

            <h2>
              Bookable services
            </h2>
          </div>

        </div>


        <div
          id="servicesList"
          class="es-empty-state"
        >
          Loading services…
        </div>

      </section>

    </main>

  </div>

  <script src="/services/services.js"></script>

</body>
</html>
