<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Login | Eselram</title>

  <link
    rel="stylesheet"
    href="/app/assets/css/eselram.css"
  >
</head>

<body>

  <main class="es-page">
    <section class="es-card">

      <div class="es-brand">ESELRAM</div>

      <p class="es-eyebrow">
        Welcome back
      </p>

      <h1>
        Sign in to Eselram.
      </h1>

      <p class="es-lead">
        Access your bookings, clients and business settings.
      </p>

      <form id="loginForm">

        <label>
          Email address

          <input
            id="email"
            type="email"
            required
            autocomplete="email"
          >
        </label>


        <label>
          Password

          <div class="es-password-field">

            <input
              id="password"
              type="password"
              required
              autocomplete="current-password"
            >

            <button
              class="es-password-toggle"
              type="button"
              data-target="password"
            >
              Show
            </button>

          </div>
        </label>


        <div
          id="formStatus"
          class="es-status"
          role="status"
          aria-live="polite"
          hidden
        ></div>


        <button
          id="loginButton"
          class="es-button"
          type="submit"
        >
          Sign In
        </button>

      </form>

    </section>
  </main>

  <script src="/auth/login.js"></script>

</body>
</html>
