<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Payments | Eselram</title>

  <link
    rel="stylesheet"
    href="/app/assets/css/eselram.css"
  >
</head>

<body>

  <main class="es-page">
    <section class="es-card">

      <div class="es-setup-signature es-setup-signature--top" aria-label="Inspired by Eselram">
        <span>Inspired by</span>
        <img src="/assets/eselrem_%20brandmark_setup.png" alt="Eselram">
      </div>

      <p class="es-eyebrow">
        Step 4 of 5
      </p>

      <h1>
        How would you like to get paid?
      </h1>

      <p class="es-lead">
        Choose the payment methods you want available
        for your business. You can change these later.
      </p>

      <form id="paymentsForm">

        <div class="es-payment-options">

          <label class="es-payment-card">
            <input
              type="checkbox"
              name="provider"
              value="stripe"
            >

            <span class="es-payment-content">
              <strong>Stripe</strong>
              <small>
                Accept secure card payments online.
              </small>
            </span>
          </label>


          <label class="es-payment-card es-payment-card--disabled" aria-disabled="true">
            <input
              type="checkbox"
              name="provider"
              value="paypal"
              disabled
            >

            <span class="es-payment-content">
              <strong>PayPal <span class="es-coming-soon">Coming soon</span></strong>
              <small>
                Let clients pay using PayPal.
              </small>
            </span>
          </label>


          <label class="es-payment-card es-payment-card--disabled" aria-disabled="true">
            <input
              type="checkbox"
              name="provider"
              value="sumup"
              disabled
            >

            <span class="es-payment-content">
              <strong>SumUp <span class="es-coming-soon">Coming soon</span></strong>
              <small>
                Accept payments through SumUp.
              </small>
            </span>
          </label>


          <label class="es-payment-card es-payment-card--disabled" aria-disabled="true">
            <input
              type="checkbox"
              name="provider"
              value="square"
              disabled
            >

            <span class="es-payment-content">
              <strong>Square <span class="es-coming-soon">Coming soon</span></strong>
              <small>
                Accept payments through Square.
              </small>
            </span>
          </label>


          <label class="es-payment-card">
            <input
              type="checkbox"
              name="provider"
              value="manual"
              checked
            >

            <span class="es-payment-content">
              <strong>Pay in person</strong>
              <small>
                Allow clients to book without paying online.
              </small>
            </span>
          </label>

        </div>


        <label class="es-default-payment">
          Default payment method

          <select
            id="defaultProvider"
            required
          >
            <option value="manual">
              Pay in person
            </option>
          </select>
        </label>


        <div class="es-payment-note">
          Online payment accounts will be connected securely
          after your Eselram setup is complete.
        </div>


        <div
          id="formStatus"
          class="es-status"
          role="status"
          aria-live="polite"
          hidden
        ></div>


        <button
          id="continueButton"
          class="es-button"
          type="submit"
        >
          Continue
        </button>

      </form>
</section>
  </main>

  <script src="/installer/payments.js"></script>

</body>
</html>
