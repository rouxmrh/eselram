<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Welcome to Eselram</title>

  <link
    rel="stylesheet"
    href="/app/assets/css/eselram.css"
  >
</head>

<body>

  <main class="es-page">

    <section class="es-card">

      <div class="es-brand">
        ESELRAM
      </div>

      <p class="es-eyebrow">
        Welcome
      </p>

      <h1>
        Your business,
        beautifully organised.
      </h1>

      <p class="es-lead">
        Eselram brings bookings, clients, payments and
        business management together in one place.
      </p>

      <div
        id="systemStatus"
        class="es-status"
        role="status"
        aria-live="polite"
      >
        Checking your Eselram installation…
      </div>

      <button
        id="getStartedButton"
        class="es-button"
        type="button"
        hidden
      >
        Get Started
      </button>

    </section>

  </main>

  <script src="/installer/installer.js"></script>

</body>
</html>
