<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Welcome to Eselram</title>

  <link
    rel="stylesheet"
    href="/app/assets/css/eselram.css?v=20260821-mobile-nav-v2"
  >
</head>

<body>

  <main class="es-page">

    <section class="es-card">

      <div
        class="es-setup-signature es-setup-signature--top"
        aria-label="Inspired by Eselram"
      >
        <span>Inspired by</span>
        <img
          src="/assets/eselrem_%20brandmark_setup.png"
          alt="Eselram"
        >
      </div>

      <p class="es-eyebrow">
        Welcome
      </p>

      <h1 style="color: #365178;">
        Your business,
        beautifully linked.
      </h1>

      <p class="es-lead">
        Eselram brings bookings, clients, payments and
        business management together in one place.
      </p>

      <div
        id="systemStatus"
        class="es-status"
        role="status"
        aria-live="polite"
      >
        Checking your Eselram installation…
      </div>

      <button
        id="getStartedButton"
        class="es-button"
        type="button"
        hidden
      >
        Get Started
      </button>

    </section>

  </main>

  <script src="/installer/installer.js"></script>

</body>
</html>
