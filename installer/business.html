<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Business Details | Eselram</title>
  <link rel="stylesheet" href="/app/assets/css/eselram.css?v=20260821-mobile-nav-v2">
</head>
<body>

  <main class="es-page">
    <section class="es-card">

      <div class="es-setup-signature es-setup-signature--top" aria-label="Inspired by Eselram">
        <span>Inspired by</span>
        <img src="/assets/eselram_brandmark_setup.png" alt="Eselram">
      </div>

      <p class="es-eyebrow">Step 1 of 5</p>

      <h1 style="color: #365178;">Tell us about your business.</h1>

      <p class="es-lead">
        These details will be used across your booking system.
      </p>

      <form id="businessForm">

        <label>
          Business name
          <input
            id="businessName"
            name="name"
            type="text"
            required
            autocomplete="organization"
          >
        </label>

        <label>
          Business email
          <input
            id="businessEmail"
            name="email"
            type="email"
            required
            autocomplete="email"
          >
        </label>

        <label>
          Phone number
          <input
            id="businessPhone"
            name="phone"
            type="tel"
            autocomplete="tel"
          >
        </label>

        <label>
          Country
          <select id="country" name="country_code" required>
            <option value="GB">United Kingdom</option>
            <option value="IE">Ireland</option>
            <option value="US">United States</option>
            <option value="AU">Australia</option>
            <option value="NZ">New Zealand</option>
            <option value="ZA">South Africa</option>
          </select>
        </label>

        <label>
          Timezone
          <select id="timezone" name="timezone" required>
          <option value="Europe/London">United Kingdom - London</option>
          <option value="Europe/Dublin">Ireland - Dublin</option>
          <option value="America/New_York">US/Canada - Eastern</option>
          <option value="America/Chicago">US/Canada - Central</option>
          <option value="America/Denver">US/Canada - Mountain</option>
          <option value="America/Phoenix">US - Arizona</option>
          <option value="America/Los_Angeles">US/Canada - Pacific</option>
          <option value="Australia/Sydney">Australia - Sydney/Melbourne</option>
          <option value="Australia/Brisbane">Australia - Brisbane</option>
          <option value="Australia/Adelaide">Australia - Adelaide</option>
          <option value="Australia/Perth">Australia - Perth</option>
          <option value="Pacific/Auckland">New Zealand - Auckland</option>
          <option value="Africa/Johannesburg">South Africa - Johannesburg</option>
        </select>
        </label>

        <label>
          Currency
          <select id="currency" name="currency" required>
            <option value="GBP">GBP – £</option>
            <option value="EUR">EUR – €</option>
            <option value="USD">USD – $</option>
            <option value="AUD">AUD – $</option>
            <option value="NZD">NZD – $</option>
            <option value="ZAR">ZAR – R</option>
          </select>
        </label>

        <div
          id="formStatus"
          class="es-status"
          role="status"
          aria-live="polite"
          hidden
        ></div>

        <button
          class="es-button"
          type="submit"
        >
          Continue
        </button>

      </form>
</section>
  </main>

  <script src="/installer/business.js"></script>

</body>
</html>
