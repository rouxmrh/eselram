<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Business Details | Eselram</title>
  <link rel="stylesheet" href="/app/assets/css/eselram.css">
</head>
<body>

  <main class="es-page">
    <section class="es-card">

      <div class="es-setup-signature es-setup-signature--top" aria-label="Inspired by Eselram">
        <span>Inspired by</span>
        <img src="/assets/eselrem_%20brandmark_setup.png" alt="Eselram">
      </div>

      <p class="es-eyebrow">Step 1 of 5</p>

      <h1>Tell us about your business.</h1>

      <p class="es-lead">
        These details will be used across your booking system.
      </p>

      <form id="businessForm">

        <label>
          Business name
          <input
            id="businessName"
            name="name"
            type="text"
            required
            autocomplete="organization"
          >
        </label>

        <label>
          Business email
          <input
            id="businessEmail"
            name="email"
            type="email"
            required
            autocomplete="email"
          >
        </label>

        <label>
          Phone number
          <input
            id="businessPhone"
            name="phone"
            type="tel"
            autocomplete="tel"
          >
        </label>

        <label>
          Country
          <select id="country" name="country_code" required>
            <option value="GB">United Kingdom</option>
            <option value="IE">Ireland</option>
            <option value="US">United States</option>
            <option value="AU">Australia</option>
            <option value="NZ">New Zealand</option>
            <option value="ZA">South Africa</option>
          </select>
        </label>

        <label>
          Timezone
          <select id="timezone" name="timezone" required>
            <option value="Europe/London">Europe/London</option>
            <option value="Europe/Dublin">Europe/Dublin</option>
            <option value="Africa/Johannesburg">Africa/Johannesburg</option>
            <option value="America/New_York">America/New_York</option>
            <option value="America/Los_Angeles">America/Los_Angeles</option>
            <option value="Australia/Sydney">Australia/Sydney</option>
            <option value="Pacific/Auckland">Pacific/Auckland</option>
          </select>
        </label>

        <label>
          Currency
          <select id="currency" name="currency" required>
            <option value="GBP">GBP – £</option>
            <option value="EUR">EUR – €</option>
            <option value="USD">USD – $</option>
            <option value="AUD">AUD – $</option>
            <option value="NZD">NZD – $</option>
            <option value="ZAR">ZAR – R</option>
          </select>
        </label>

        <div
          id="formStatus"
          class="es-status"
          role="status"
          aria-live="polite"
          hidden
        ></div>

        <button
          class="es-button"
          type="submit"
        >
          Continue
        </button>

      </form>
</section>
  </main>

  <script src="/installer/business.js"></script>

</body>
</html>
